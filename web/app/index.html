<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniMax H3 Prompt Maker</title>
    <link rel="stylesheet" href="./tailwind.css" />
    <!--
      Colour semantics — one hue, one meaning. Before this was written down, amber
      meant video AND warning AND system directives, emerald meant audio AND
      "directive active", and the primary action was indigo in the app shell but
      blue in the shared Button. Pick from this table rather than adding a hue:

        gray     surfaces, body copy, disabled
        indigo   primary action, reference pictures
        amber    video references        (<Video N>)
        emerald  audio references        (<Audio N>), copy-succeeded
        sky      user system directives
        fuchsia  remake mode
        purple   multi-segment / AI-generated edits
        orange   warnings (recoverable, the user can continue)
        red      errors and destructive actions
        rose     storyboard mode badge
        pink     brand gradient accent only — never on its own
    -->
    
    <style>
      body {
        background-color: #0d1117;
        color: #e5e7eb;
      }
      /* Custom scrollbar for code blocks */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a202c; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4a5568; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #718096; 
      }
      /* Keyboard users had no way to tell where focus was: the app styles
         everything with Tailwind utilities and none of them set a focus ring,
         while several controls are divs. One default covers every control;
         :focus-visible keeps it off mouse clicks. */
      :focus-visible {
        outline: 2px solid #818cf8;
        outline-offset: 2px;
        border-radius: 4px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      /* Korean does not break inside a word the way English does, so the
         browser default splits phrases mid-syllable-block and the text reads
         loose and ragged. keep-all is the correct rule; anywhere keeps a long
         unbreakable token (a URL, a model id) from overflowing the box. */
      .h3-ko {
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      /* Short viewports — the ComfyUI overlay is routinely 800x600 or less.
         At that height the mode picker, the drop zone and the settings grid
         filled the entire first screen and the scene textarea, the one field
         you type in every single time, sat below the fold with nothing on
         screen suggesting it was there.

         The column is a flexbox, so `order` moves the scene request above the
         attachment chrome without touching the DOM or the tall-screen layout.
         Hand-written CSS rather than a Tailwind variant: tools/check_tailwind
         only validates the standard prefixes, so a custom one could silently
         fail to make it into the offline stylesheet. */
      @media (max-height: 820px) {
        .h3-attach-zone,
        .h3-attach-buttons,
        .h3-settings { order: 1; }
        .h3-generate { order: 2; }
        .h3-attach-zone { height: 5rem !important; padding: 0.5rem !important; }
        .h3-drop-sub,
        .h3-mode-tag,
        .h3-mode-desc { display: none !important; }
      }
      @media (max-height: 680px) {
        /* Tighter still: at 600px the header alone takes a tenth of the screen. */
        .h3-attach-zone { height: 4rem !important; }
      }
    </style>
  
<link rel="stylesheet" href="./index.css">
  <script type="module" crossorigin src="./assets/index-B3Ljh8LD.js"></script>
</head>

    <div id="root"></div>
</body>
</html>
